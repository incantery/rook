name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The app. This job is the point of CI: before the cutover nothing here
  # built Zig, so the shipping app could break while a type error in the
  # retired Svelte tree blocked the merge. macOS because the app is AppKit
  # and Metal all the way down (app/src/macos.zig) — there is no
  # cross-compile of this to check on Linux.
  zig:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Reads the version from app/build.zig.zon's minimum_zig_version, and
      # caches the global zig cache — which is where the fetched ghostty-vt
      # and zig-objc tarballs land, so this is also the dependency cache.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Debug, not ReleaseFast: this gate answers "does it still build and
      # do the tests pass", and Debug compiles several times faster. The
      # ReleaseFast binary is what app/bench.sh measures, and perf numbers
      # are not a CI concern — see app/PERF.md for why they are measured by
      # hand on a known machine.
      - name: Build
        run: zig build

      # build.zig wires four test roots, not one: test decls in files the
      # exe module never imports are invisible to a single addTest, and
      # that hole silently swallowed the editor's tests once already.
      - name: Test
        run: zig build test

      # The e2e suite cannot RUN here — it needs a window server, a Metal
      # device, and real shells. It can still be COMPILED, and it has to
      # be: nothing else in the build graph reaches app/e2e/, so this is
      # the only thing standing between the harness and silent bit-rot as
      # Zig's std moves under it.
      - name: Build e2e harness
        run: zig build e2e-check

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Scope: ./... would hit the build/ios scaffold (doesn't compile) and
      # cmd/rook, the wails GUI binary, which can't even typecheck on Linux
      # without the GTK4/webkitgtk dev headers (a 1-2 min install). cmd/rook
      # is a thin wiring main exercised by every local `make dev` build on
      # macOS; everything it wires lives in internal/, which is covered.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          args: ./internal/... ./cmd/rook-host/... ./cmd/rook-agent/... ./cmd/rookctl/...

      - name: Test
        run: go test ./internal/... ./cmd/rook-host/... ./cmd/rook-agent/... ./cmd/rookctl/...

# The retired webview app is gated by .github/workflows/web.yml, which only
# fires when frontend/ actually changes. It used to run here on every PR —
# minutes of install-and-build to protect a fallback that nothing ships.
