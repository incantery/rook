name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Scope: ./... would hit the build/ios scaffold (doesn't compile) and
      # cmd/rook, the wails GUI binary, which can't even typecheck on Linux
      # without the GTK4/webkitgtk dev headers (a 1-2 min install). cmd/rook
      # is a thin wiring main exercised by every local `make dev` build on
      # macOS; everything it wires lives in internal/, which is covered.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          args: ./internal/... ./cmd/rook-host/... ./cmd/rook-agent/... ./cmd/rookctl/...

      - name: Test
        run: go test ./internal/... ./cmd/rook-host/... ./cmd/rook-agent/... ./cmd/rookctl/...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from frontend/package.json's packageManager field
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build
