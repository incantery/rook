# The retired webview app (frontend/ + cmd/rook).
#
# rook was a Wails app — Go + Svelte + xterm.js in a WKWebView — until
# 2026-07-28. frontend/ is kept as the way back, not as a live surface, and
# nothing in the shipped app depends on it. So this is deliberately NOT part
# of the CI that gates a merge: it runs only when frontend/ itself changes,
# plus on demand. See STATUS.md and app/PARITY.md.
name: web (retired)

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from frontend/package.json's packageManager field
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build
