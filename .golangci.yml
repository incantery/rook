version: "2"

# Default linter set (errcheck, govet, ineffassign, staticcheck, unused),
# with errcheck tuned down: this codebase makes deliberate fire-and-forget
# calls for cleanup paths (defer Close, best-effort kills/removes, writes
# to an already-doomed pty or websocket). Checking those adds noise, not
# safety — new categories of noise should be excluded here, not silenced
# inline.
linters:
  settings:
    errcheck:
      exclude-functions:
        # defer f.Close() and friends
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        # fire-and-forget writes to a pty or stdout
        - (*os.File).Write
        - fmt.Fprint
        # Terminal.Write parses pty output into the grid; it is io.Writer-shaped
        # for convenience, and the only implementation always returns nil
        - (github.com/incantery/rook/internal/host.Terminal).Write
        # best-effort resize: the pty may already be gone
        - github.com/creack/pty.Setsize
        # best-effort filesystem cleanup
        - os.Remove
        - os.RemoveAll
        - os.Rename
        - os.Symlink
        # crypto/rand.Read never returns an error as of Go 1.24 — it fills b
        # entirely or panics, so the check is dead code
        - crypto/rand.Read
        # LSP notifications are one-way by protocol, and a response written to
        # a conn that has already died is the conn's problem, not the caller's
        - (*github.com/incantery/rook/internal/lsp.conn).notify
        - (*github.com/incantery/rook/internal/lsp.conn).writeMsg
        # best-effort process teardown
        - (*os/exec.Cmd).Run
        - (*os/exec.Cmd).Wait
        - (*os.Process).Kill
        - syscall.Kill
        # websocket close paths (Conn.Close takes args, so it isn't io.Closer)
        - (*github.com/coder/websocket.Conn).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        # best-effort JSON: encode onto an http.ResponseWriter, or parse a
        # payload where the zero value is an acceptable fallback
        - (*encoding/json.Encoder).Encode
        - (*encoding/json.Decoder).Decode
        - encoding/json.Unmarshal
        # hash writes never fail (hash.Hash docs)
        - (hash.Hash).Write
        # defer tx.Rollback() after a successful Commit errors by design
        - (*database/sql.Tx).Rollback
  exclusions:
    rules:
      # Tests routinely ignore errors from setup/teardown helpers.
      - path: _test\.go
        linters:
          - errcheck
