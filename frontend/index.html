<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rook</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* The one place the background tint is painted: Material Ocean at
           ghostty's background-opacity 0.95, full-bleed so the titlebar
           strip and edge margins are tinted too. xterm's own background is
           fully transparent — tinting there as well would double-apply. */
        background: rgba(15, 17, 26, 0.95);
        overflow: hidden;
      }
      /* Insets, NOT padding: the fit addon derives the grid from this
         element's computed height and only subtracts padding on xterm's own
         element — container padding silently inflates the grid past the
         visible area and clips the bottom row(s). Side/bottom insets match
         ghostty's window-padding 4px; the top inset matches
         InvisibleTitleBarHeight in main.go (window drag region, keeps row 0
         clear of the traffic lights). */
      #terminal {
        position: absolute;
        inset: 34px 4px 4px;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
