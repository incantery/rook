<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rook</title>
    <style>
      /* html must stay transparent: the tint lives on body ALONE (a second
         layer would stack under config opacity changes). */
      html {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      body {
        margin: 0;
        height: 100%;
        /* Pre-JS default; main.ts overwrites from the config's
           background-opacity. */
        background: rgba(15, 17, 26, 0.95);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        --acc: #82aaff;
        --grn: #c3e88d;
        --fg: #d6deeb;
        --dim: #8f93a2;
        --lo: #5b6273;
        --line: rgba(140, 150, 180, 0.14);
        --raise: rgba(255, 255, 255, 0.035);
        --mono: "Hack Nerd Font Mono", Menlo, ui-monospace, monospace;
      }

      /* ==== titlebar: drag region; tab strip is centered bare window
         numbers, straight from the tmux config (status-justify centre,
         window-status-format ' #{window_index} '). 44px centers content on
         the hidden-inset traffic lights. ==== */
      #titlebar {
        position: relative;
        flex: 0 0 44px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 10px 0 84px;
        background: var(--raise);
        border-bottom: 1px solid var(--line);
        --wails-draggable: drag;
      }
      #tabs {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;
      }
      .tab {
        appearance: none;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        padding: 0 13px;
        font-size: 13px;
        font-family: var(--mono);
        color: var(--lo);
        cursor: pointer;
      }
      .tab:hover {
        color: var(--dim);
      }
      .tab.active {
        color: #ffffff;
        font-weight: 700;
      }
      .tab-new {
        font-size: 14px;
      }
      .tab-dash.active {
        color: var(--acc);
        font-weight: 700;
      }
      /* a claude session in this window is waiting on you */
      .tab.attn {
        color: #ffcb6b;
        animation: attn-pulse 1.6s ease-in-out infinite;
      }
      @keyframes attn-pulse {
        50% {
          opacity: 0.45;
        }
      }
      #ws-label {
        position: absolute;
        left: 84px;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--lo);
        cursor: pointer;
        padding: 0 6px;
      }
      #ws-label:hover {
        color: var(--dim);
      }
      #prefix-pill {
        align-self: center;
        margin-right: 10px;
        padding: 2px 9px;
        border-radius: 10px;
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 600;
        color: #ffcb6b;
        background: rgba(255, 203, 107, 0.12);
        border: 1px solid rgba(255, 203, 107, 0.35);
      }
      #prefix-pill[hidden] {
        display: none;
      }
      #palette-btn {
        appearance: none;
        align-self: center;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px 4px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        color: var(--dim);
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      #palette-btn:hover {
        color: var(--fg);
        background: rgba(255, 255, 255, 0.08);
      }
      #palette-btn kbd {
        font-family: var(--mono);
        font-size: 10.5px;
        padding: 1px 5px;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--lo);
      }

      /* ==== terminal area: one wrap per session, only .active shown ==== */
      #terminals {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      .term-wrap {
        position: absolute;
        inset: 0;
        display: none;
      }
      .term-wrap.active {
        display: block;
      }
      /* Insets, NOT padding: the fit addon derives the grid from this
         element's computed height and container padding silently inflates
         the grid past the visible area. */
      .term-box {
        position: absolute;
        inset: 2px 4px 4px;
      }
      /* xterm v6 ships an opaque #000 on this bare div; it would paint over
         the translucent body tint. */
      .xterm .xterm-viewport {
        background-color: transparent !important;
      }

      /* ==== workspace dashboard: window 0, frosted over the terminals so
         the window's translucency survives ==== */
      #dashboard {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow-y: auto;
        background: rgba(15, 17, 26, 0.72);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }
      #dashboard[hidden] {
        display: none;
      }
      #dash-inner {
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 26px 60px;
      }
      .dash-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 24px;
      }
      .dash-head-text {
        flex: 1;
        min-width: 0;
      }
      .dash-name {
        font-size: 20px;
        font-weight: 700;
        color: var(--fg);
      }
      .dash-root {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--lo);
        margin-top: 5px;
      }
      .dash-pills {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .dash-pill {
        font-family: var(--mono);
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--dim);
        white-space: nowrap;
      }
      .dash-pill.branch {
        color: var(--acc);
        background: rgba(130, 170, 255, 0.1);
      }
      .dash-pill.dirty {
        color: #ffcb6b;
        background: rgba(255, 203, 107, 0.1);
      }
      .dash-pill.clean {
        color: var(--grn);
        background: rgba(195, 232, 141, 0.1);
      }
      .dash-pill.sync {
        color: var(--dim);
      }
      .dash-sec {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--lo);
        margin: 0 0 10px;
      }
      #dash-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
        margin-bottom: 26px;
      }
      .dash-card {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        padding: 12px 14px;
        cursor: pointer;
        transition: border-color 0.15s ease;
      }
      .dash-card:hover {
        border-color: rgba(140, 150, 180, 0.4);
      }
      .dash-card-top {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-bottom: 7px;
      }
      .dash-num {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--lo);
      }
      .dash-fg {
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 700;
        color: var(--fg);
      }
      .dash-fg.agent {
        color: var(--grn);
      }
      .dash-spacer {
        flex: 1;
      }
      .dash-when {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--lo);
        white-space: nowrap;
      }
      .dash-cwd {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--lo);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dash-agent {
        margin-top: 9px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .dash-agent-chip {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);
      }
      .dash-agent.working .dash-agent-chip {
        color: var(--grn);
      }
      .dash-agent.needs_input .dash-agent-chip {
        color: #ffcb6b;
      }
      .dash-agent.quiet .dash-agent-chip {
        color: var(--lo);
      }
      .dash-agent-text {
        margin-top: 5px;
        font-size: 11px;
        color: var(--dim);
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .dash-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }

      /* ==== command palette + workspace picker overlays ==== */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 16, 0.55);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 12vh;
        z-index: 50;
      }
      .overlay[hidden] {
        display: none;
      }
      .pal-panel {
        width: 600px;
        max-width: 92vw;
        background: rgba(21, 25, 36, 0.98);
        border: 1px solid rgba(140, 150, 180, 0.3);
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }
      .pal-inputrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 15px;
        border-bottom: 1px solid var(--line);
      }
      .pal-chevron {
        color: var(--lo);
        font-family: var(--mono);
        font-size: 14px;
      }
      .pal-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--fg);
        font-family: inherit;
        font-size: 15px;
      }
      .pal-esc {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--lo);
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .pal-list {
        max-height: 48vh;
        overflow-y: auto;
        padding: 6px;
      }
      .pal-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border-radius: 7px;
        cursor: pointer;
      }
      .pal-item:hover,
      .pal-item.sel {
        background: rgba(130, 170, 255, 0.16);
      }
      .pal-title {
        flex: 1;
        font-size: 13px;
        color: var(--fg);
      }
      .pal-cat {
        font-size: 10.5px;
        color: var(--lo);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .pal-keys {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        min-width: 42px;
        text-align: right;
      }
      .pal-footer {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 9px 15px;
        border-top: 1px solid var(--line);
        font-size: 10.5px;
        color: var(--lo);
        font-family: var(--mono);
      }
      .pal-spacer {
        flex: 1;
      }

      /* ==== attention inbox (` a) — palette-shaped overlay ==== */
      .inbox-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--fg);
      }
      .inbox-row {
        display: block;
      }
      .inbox-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .inbox-chip {
        font-family: var(--mono);
        font-size: 11px;
        color: #ffcb6b;
        background: rgba(255, 203, 107, 0.1);
        padding: 2px 7px;
        border-radius: 5px;
      }
      .inbox-age {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--lo);
        margin-left: auto;
      }
      .inbox-ask {
        margin-top: 6px;
        font-size: 12.5px;
        color: var(--fg);
        line-height: 1.45;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .inbox-draft {
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.45;
      }
      .inbox-draft.pending {
        display: none;
      }
      .inbox-draft.ready {
        color: var(--grn);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .inbox-draft.escalate {
        color: #ffcb6b;
      }
      .inbox-edit {
        width: 100%;
        box-sizing: border-box;
        background: rgba(10, 12, 20, 0.8);
        border: 1px solid var(--acc);
        border-radius: 7px;
        padding: 7px 9px;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
        resize: vertical;
      }
      .inbox-edit-hint {
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--lo);
      }
      .key-status {
        font-size: 11.5px;
        color: var(--lo);
        font-family: var(--mono);
        line-height: 1.5;
      }
      .key-status.ok {
        color: var(--grn);
      }
      .key-error {
        font-size: 11.5px;
        color: #ff5370;
        font-family: var(--mono);
      }
      .key-error[hidden] {
        display: none;
      }
      .inbox-empty {
        padding: 26px;
        text-align: center;
        color: var(--lo);
        font-size: 12.5px;
      }
      /* titlebar count chip: how many sessions are waiting on you */
      #attn-chip {
        appearance: none;
        border: none;
        align-self: center;
        margin-right: 10px;
        padding: 2px 9px;
        border-radius: 10px;
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 600;
        color: #ffcb6b;
        background: rgba(255, 203, 107, 0.12);
        border: 1px solid rgba(255, 203, 107, 0.35);
        cursor: pointer;
      }
      #attn-chip[hidden] {
        display: none;
      }
      .ws-tag.attn {
        background: rgba(255, 203, 107, 0.12);
        color: #ffcb6b;
        animation: attn-pulse 1.6s ease-in-out infinite;
      }
      /* dashboard card hint: the drafter has a reply waiting in the inbox */
      .dash-draft {
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--grn);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ==== home: the workspace manager (landing screen) ==== */
      #home {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #home[hidden], #app-screen[hidden] {
        display: none;
      }
      #app-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #home-strip {
        flex: 0 0 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 22px 0 84px;
        --wails-draggable: drag;
      }
      #home-strip .brand {
        font-size: 14px;
        font-weight: 700;
        color: var(--fg);
      }
      #home-strip .brand-sub {
        font-size: 11px;
        color: var(--lo);
        font-family: var(--mono);
      }
      #home-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 26px 60px;
      }
      #home-inner {
        max-width: 980px;
        margin: 0 auto;
      }
      .resume {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        border: 1px solid rgba(130, 170, 255, 0.3);
        border-radius: 12px;
        background: rgba(130, 170, 255, 0.06);
        margin: 14px 0 28px;
      }
      .resume[hidden] {
        display: none;
      }
      .resume-text {
        flex: 1;
        min-width: 0;
      }
      .resume-kicker {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--acc);
        margin-bottom: 5px;
      }
      .resume-body {
        font-size: 13.5px;
        color: var(--fg);
        line-height: 1.5;
      }
      .resume-btn {
        flex: 0 0 auto;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 9px;
        background: var(--acc);
        border: none;
        color: #10131c;
        cursor: pointer;
        font-family: inherit;
      }
      .resume-btn:hover {
        filter: brightness(1.1);
      }
      .home-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 4px 0 16px;
      }
      .home-head h2 {
        font-size: 15px;
        font-weight: 700;
        color: var(--fg);
        margin: 0;
      }
      .home-spacer {
        flex: 1;
      }
      .home-btn {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        color: var(--fg);
        cursor: pointer;
        font-family: inherit;
      }
      .home-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .home-btn .plus {
        color: var(--acc);
        font-size: 14px;
        line-height: 0;
      }
      #home-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 12px;
      }
      .ws-card {
        border: 1px solid var(--line);
        border-left: 2px solid var(--acc);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.025);
        padding: 14px 15px;
        cursor: pointer;
        transition: border-color 0.15s ease, transform 0.12s ease;
      }
      .ws-card:hover {
        border-color: rgba(140, 150, 180, 0.4);
        transform: translateY(-1px);
      }
      .ws-card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }
      .ws-card-name {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--fg);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ws-card-del {
        appearance: none;
        background: none;
        border: none;
        color: transparent;
        font-size: 11px;
        cursor: pointer;
        padding: 2px 4px;
      }
      .ws-card:hover .ws-card-del {
        color: var(--lo);
      }
      .ws-card-del:hover {
        color: #ff5370 !important;
      }
      .ws-card-when {
        font-size: 10.5px;
        color: var(--lo);
        font-family: var(--mono);
        white-space: nowrap;
      }
      .ws-card-root {
        font-size: 11px;
        color: var(--lo);
        font-family: var(--mono);
        margin-bottom: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ws-card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ws-tag {
        font-size: 10.5px;
        font-family: var(--mono);
        padding: 2px 7px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--dim);
      }
      .ws-tag.live {
        background: rgba(195, 232, 141, 0.12);
        color: var(--grn);
      }
      .ws-tag.scratch {
        background: rgba(255, 203, 107, 0.12);
        color: #ffcb6b;
      }
      #home-error {
        margin: 0 0 14px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 83, 112, 0.4);
        border-radius: 8px;
        background: rgba(255, 83, 112, 0.08);
        color: #ff5370;
        font-size: 12px;
        font-family: var(--mono);
      }
      .home-empty {
        grid-column: 1 / -1;
        padding: 40px;
        text-align: center;
        color: var(--lo);
        font-size: 13px;
      }

      /* new-workspace modal (reuses overlay + pal-panel) */
      .ws-form {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .ws-form label span {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--dim);
        margin-bottom: 6px;
      }
      .ws-form input,
      .ws-form textarea {
        width: 100%;
        box-sizing: border-box;
        background: rgba(10, 12, 20, 0.8);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 12.5px;
        outline: none;
        resize: vertical;
      }
      .ws-form input:focus,
      .ws-form textarea:focus {
        border-color: var(--acc);
      }
      .ws-modal-title {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        font-weight: 700;
        color: var(--fg);
      }
      .ws-modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        padding: 14px 18px;
        border-top: 1px solid var(--line);
      }
      .ws-modal-foot .home-btn.primary {
        background: var(--acc);
        color: #10131c;
        border: none;
      }

      #fatal {
        color: #ff5370;
        font-family: var(--mono);
        font-size: 13px;
        padding: 24px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="home" hidden>
      <div id="home-strip">
        <span class="brand">Rook</span>
        <span class="brand-sub">workspace manager</span>
      </div>
      <div id="home-scroll">
        <div id="home-inner">
          <div id="home-resume" class="resume" hidden></div>
          <div class="home-head">
            <h2>Workspaces</h2>
            <span class="home-spacer"></span>
            <button id="home-scratch" class="home-btn" style="--wails-draggable: no-drag" title="One-off shell; discarded when it exits">scratch shell</button>
            <button id="home-new" class="home-btn" style="--wails-draggable: no-drag"><span class="plus">+</span> New workspace</button>
          </div>
          <div id="home-grid"></div>
        </div>
      </div>
    </div>

    <div id="ws-modal" class="overlay" hidden>
      <div class="pal-panel">
        <div class="ws-modal-title">New workspace</div>
        <div class="ws-form">
          <label><span>Name</span><input id="ws-modal-name" placeholder="e.g. rook-core" spellcheck="false" /></label>
          <label><span>Directory (optional — or set it later from inside the workspace: cd anywhere, then ` .)</span><input id="ws-modal-root" placeholder="~/go/src/github.com/incantery/rook" spellcheck="false" /></label>
        </div>
        <div class="ws-modal-foot">
          <button id="ws-modal-cancel" class="home-btn">Cancel</button>
          <button id="ws-modal-create" class="home-btn primary">Create workspace</button>
        </div>
      </div>
    </div>

    <div id="app-screen" hidden>
    <div id="titlebar">
      <span id="ws-label" style="--wails-draggable: no-drag" title="Switch workspace (` s)"></span>
      <div id="tabs"></div>
      <span id="prefix-pill" hidden>prefix</span>
      <button id="attn-chip" style="--wails-draggable: no-drag" title="Attention inbox (` a)" hidden></button>
      <button id="palette-btn" style="--wails-draggable: no-drag">
        commands <kbd>⌘K</kbd>
      </button>
    </div>
    <div id="terminals">
      <div id="dashboard" hidden>
        <div id="dash-inner">
          <div class="dash-head">
            <div class="dash-head-text">
              <div class="dash-name"></div>
              <div class="dash-root"></div>
            </div>
            <div class="dash-pills"></div>
          </div>
          <div class="dash-sec">Windows</div>
          <div id="dash-grid"></div>
          <div class="dash-actions">
            <button class="home-btn" data-cmd="session.new"><span class="plus">+</span> New window</button>
            <button class="home-btn" data-cmd="workspace.set-root">Set root to shell's cwd</button>
            <button class="home-btn" data-cmd="workspace.manager">Workspace manager</button>
          </div>
        </div>
      </div>
    </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
