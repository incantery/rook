<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rook</title>
    <style>
      /* html must stay transparent: the tint lives on body ALONE. With a
         background on both, the config's body override sat on top of a
         second 0.95 layer on html and opacity changes barely showed. */
      html {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      body {
        margin: 0;
        height: 100%;
        /* The one place the background tint is painted: full-bleed, so the
           titlebar strip and edge margins are tinted too. This value is the
           pre-JS default; main.ts overwrites it from the rook config's
           background-opacity. xterm's own background is fully transparent —
           tinting there as well would double-apply. */
        background: rgba(15, 17, 26, 0.95);
        overflow: hidden;
      }
      /* Insets, NOT padding: the fit addon derives the grid from this
         element's computed height and only subtracts padding on xterm's own
         element — container padding silently inflates the grid past the
         visible area and clips the bottom row(s). Side/bottom insets match
         ghostty's window-padding 4px; the top inset matches
         InvisibleTitleBarHeight in main.go (window drag region, keeps row 0
         clear of the traffic lights). */
      #terminal {
        position: absolute;
        inset: 34px 4px 4px;
      }
      /* xterm v6 ships `.xterm-viewport { background-color: #000 }` on a
         bare div that ignores theme.background entirely — it would paint an
         opaque black box over the translucent body tint. */
      .xterm .xterm-viewport {
        background-color: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
