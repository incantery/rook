<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rook</title>
    <style>
      /* html must stay transparent: the tint lives on body ALONE (a second
         layer would stack under config opacity changes). */
      html {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      body {
        margin: 0;
        height: 100%;
        /* Pre-JS default; main.ts overwrites from the config's
           background-opacity. */
        background: rgba(15, 17, 26, 0.95);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        --acc: #82aaff;
        --grn: #c3e88d;
        --fg: #d6deeb;
        --dim: #8f93a2;
        --lo: #5b6273;
        --line: rgba(140, 150, 180, 0.14);
        --raise: rgba(255, 255, 255, 0.035);
        --mono: "Hack Nerd Font Mono", Menlo, ui-monospace, monospace;
      }

      /* ==== titlebar: drag region, session tabs (Rook.dc.html chrome) ==== */
      #titlebar {
        flex: 0 0 38px;
        display: flex;
        align-items: stretch;
        padding-left: 84px; /* traffic lights (hidden-inset titlebar) */
        padding-right: 10px;
        background: var(--raise);
        border-bottom: 1px solid var(--line);
        --wails-draggable: drag;
      }
      #tabs {
        display: flex;
        align-items: stretch;
      }
      .tab {
        appearance: none;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        font-size: 12px;
        font-family: inherit;
        color: var(--dim);
        cursor: pointer;
      }
      .tab:hover {
        color: var(--fg);
      }
      .tab.active {
        color: var(--fg);
        font-weight: 600;
        border-bottom-color: var(--acc);
      }
      .tab .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--grn);
      }
      .tab-new {
        font-size: 14px;
        color: var(--lo);
        padding: 0 10px;
      }
      #bar-spacer {
        flex: 1;
      }
      #palette-btn {
        appearance: none;
        align-self: center;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px 4px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        color: var(--dim);
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      #palette-btn:hover {
        color: var(--fg);
        background: rgba(255, 255, 255, 0.08);
      }
      #palette-btn kbd {
        font-family: var(--mono);
        font-size: 10.5px;
        padding: 1px 5px;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--lo);
      }

      /* ==== terminal area: one wrap per session, only .active shown ==== */
      #terminals {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      .term-wrap {
        position: absolute;
        inset: 0;
        display: none;
      }
      .term-wrap.active {
        display: block;
      }
      /* Insets, NOT padding: the fit addon derives the grid from this
         element's computed height and container padding silently inflates
         the grid past the visible area. */
      .term-box {
        position: absolute;
        inset: 2px 4px 4px;
      }
      /* xterm v6 ships an opaque #000 on this bare div; it would paint over
         the translucent body tint. */
      .xterm .xterm-viewport {
        background-color: transparent !important;
      }

      /* ==== command palette (Rook.dc.html) ==== */
      #palette {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 16, 0.55);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 12vh;
        z-index: 50;
      }
      #palette[hidden] {
        display: none;
      }
      .pal-panel {
        width: 600px;
        max-width: 92vw;
        background: rgba(21, 25, 36, 0.98);
        border: 1px solid rgba(140, 150, 180, 0.3);
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }
      .pal-inputrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 15px;
        border-bottom: 1px solid var(--line);
      }
      .pal-chevron {
        color: var(--lo);
        font-family: var(--mono);
        font-size: 14px;
      }
      .pal-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--fg);
        font-family: inherit;
        font-size: 15px;
      }
      .pal-esc {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--lo);
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .pal-list {
        max-height: 48vh;
        overflow-y: auto;
        padding: 6px;
      }
      .pal-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border-radius: 7px;
        cursor: pointer;
      }
      .pal-item:hover,
      .pal-item.sel {
        background: rgba(130, 170, 255, 0.16);
      }
      .pal-title {
        flex: 1;
        font-size: 13px;
        color: var(--fg);
      }
      .pal-cat {
        font-size: 10.5px;
        color: var(--lo);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .pal-keys {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        min-width: 42px;
        text-align: right;
      }
      .pal-footer {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 9px 15px;
        border-top: 1px solid var(--line);
        font-size: 10.5px;
        color: var(--lo);
        font-family: var(--mono);
      }
      .pal-spacer {
        flex: 1;
      }

      #fatal {
        color: #ff5370;
        font-family: var(--mono);
        font-size: 13px;
        padding: 24px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="titlebar">
      <div id="tabs"></div>
      <div id="bar-spacer"></div>
      <button id="palette-btn" style="--wails-draggable: no-drag">
        commands <kbd>⌘K</kbd>
      </button>
    </div>
    <div id="terminals"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
