<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rook</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f111a;
        overflow: hidden;
      }
      /* Side/bottom padding matches ghostty's window-padding 4px. Top padding
         matches InvisibleTitleBarHeight in main.go: that strip is the window
         drag region, and keeps row 0 clear of the traffic lights. */
      #terminal {
        position: absolute;
        inset: 0;
        padding: 34px 4px 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
