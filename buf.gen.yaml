# Code generation into gen/, committed. Plugins run LOCALLY and are
# pinned by `make proto`, which installs the exact versions go.mod
# declares — generated code and library can never drift apart, and
# generation needs no network.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
